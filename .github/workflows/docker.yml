name: docker
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Docker Compose tests
        run: docker compose -f docker-compose.test.yml up --build --exit-code-from frontend_test
      - name: Paper backend Docker tests
        run: docker compose -f docker-compose.test.yml run --rm --build backend_test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-reports
          path: reports/frontend
          if-no-files-found: warn
